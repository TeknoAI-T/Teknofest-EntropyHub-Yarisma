[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "entropyhub"
version = "0.1.0"
requires-python = ">=3.8"
description = "A verifiable, RK4-integrated chaotic PRNG (Rössler system) with OS-seeded state and a runtime Lyapunov-exponent self-check."
license = { text = "MIT OR Apache-2.0" }
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
]

[tool.maturin]
python-source = "python"
module-name = "entropyhub._core"
